# 시험판(test/)을 원래 주소에 올리기 — 일지 시험판의 '원래 주소에 올리기' 단추(제작자)가 서버를 거쳐 시작시켜요.
# test/_app.html → src/app.html → index.html, test/web.js·sw.js·diag.html → 원래 자리
name: 시험판 올리기
on:
  repository_dispatch:
    types: [release-test]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: { group: release-test, cancel-in-progress: false }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: 시험판을 원래 자리로 복사
        run: |
          test -f test/_app.html
          cp test/_app.html src/app.html
          python3 tools/build.py
          cp test/web.js test/sw.js test/diag.html .
          git config user.name "diary-release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.html index.html web.js sw.js diag.html
          if git diff --cached --quiet; then echo "이미 같아요"; exit 0; fi
          B=$(grep -o 'const BUILD = [0-9]*' src/app.html | grep -o '[0-9]*$')
          git commit -m "시험판을 원래 주소에 올리기 (v$B)"
          git push
      - name: 사이트 다시 만들기
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
