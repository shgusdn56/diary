# main에 서버 코드(functions/)나 보안 규칙이 바뀌어 올라오면 Firebase에 자동으로 올려요.
# 비밀 키 없이 GitHub ↔ Google 연결(Workload Identity)로 로그인해요 — 처음 한 번 tools/setup-cloud.sh로 연결해요.
name: Firebase 서버 올리기
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firestore.rules', 'firestore.indexes.json', 'firebase.json', '.github/workflows/firebase-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency: { group: firebase-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/500724626014/locations/global/workloadIdentityPools/github/providers/diary
          service_account: github-deploy@life-diary-1c3b8.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: 서버 지역을 Firestore 위치에 맞추기
        run: |
          LOC=$(gcloud firestore databases describe --database='(default)' --project life-diary-1c3b8 --format='value(locationId)')
          case "$LOC" in nam5) R=us-central1;; eur3) R=europe-west1;; *) R=$LOC;; esac
          echo "Firestore: $LOC → functions: $R"
          echo "FN_REGION=$R" > functions/.env
      - run: npm ci
        working-directory: functions
      - name: 올리기
        run: npx -y firebase-tools@15 deploy --only functions,firestore --project life-diary-1c3b8 --non-interactive --force
